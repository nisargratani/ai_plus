name: ai_plus
description: >-
  Provider-agnostic AI SDK for Dart and Flutter: one API for OpenAI, Gemini,
  Claude and OpenAI-compatible servers, with streaming, tools, agents and RAG.
version: 0.0.2
repository: https://github.com/nisargratani/ai_plus
issue_tracker: https://github.com/nisargratani/ai_plus/issues
topics:
  - ai
  - llm
  - openai
  - gemini
  - anthropic

environment:
  sdk: ^3.4.0

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0

dev_dependencies:
  # Ranges (rather than latest-only) keep `dart test` runnable on the
  # minimum supported SDK in CI.
  lints: '>=4.0.0 <7.0.0'
  test: ^1.25.8
